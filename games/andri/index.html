<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>

<div id="wrap" style="position:relative;width:100%;max-width:960px;height:640px;margin:0 auto;background:#03030a;border-radius:12px;overflow:hidden;">
  <canvas id="c" tabindex="0" style="display:block;width:100%;height:100%;outline:none;touch-action:none;"></canvas>
  <div style="position:absolute;left:12px;bottom:10px;color:#8a8fb8;font:12px/1.5 'Segoe UI',system-ui,sans-serif;pointer-events:none;">
    Move: WASD / arrows or drag &nbsp; Fire: hold Space or click &nbsp; Bomb: X or right-click &nbsp; Focus (slow, shows hitbox): Shift &nbsp; Pause: P
  </div>
</div>

<script>
(function () {
const TAU = Math.PI * 2, rnd = Math.random;
const wrap = document.getElementById("wrap"), cv = document.getElementById("c"), mx = cv.getContext("2d");
const buf = document.createElement("canvas"), bx = buf.getContext("2d");   // scene buffer (gets warped by black holes)
let ctx = bx, W = 800, H = 640, DPR = 1;

const TOTAL_WAVES = 15;      // one cycle: last wave = TON 618 (then endless mode repeats the cycle, harder)
const MID_BOSS_WAVE = 10;    // Cerulean Giant
const TWIN_AFTER = 10;       // twin stars appear after this wave
const SHOP_WAVES = [5, 10, 14];   // wormhole shop after these waves of each cycle
const LAST_BONUS = 1000;     // bonus points for the last wormhole before TON 618
const BONUS_AFTER = 5;       // points multiplier starts after this wave
const BONUS_MULT = 1.2;
const START_BOMBS = 2;
const SHIELD_EVERY = 15;     // seconds between shields
const SHIELD_CHARGES = 4;    // bullets one shield blocks
const SHR = 64;              // shield radius
const LIFE_REGEN = 60;       // seconds per regenerated life
const BANG_T = 1.6;          // boss intro: seconds of build-up before the bang
const FONT = "'Segoe UI', system-ui, sans-serif";

const UP = {
  shield:  { name: "Shield",         cost: 2000, desc: "A shield appears every 15 seconds and blocks up to 4 bullets." },
  bullets: { name: "More bullets",   cost: 3000, desc: "Fire 7 shots per volley instead of 5." },
  life:    { name: "Extra life",     cost: 3500, desc: "+1 life. You regain a lost life every 60 seconds." },
  suns:    { name: "Extra suns",     cost: 4000, desc: "Two small suns fly beside you and shoot at enemies automatically." },
  homing:  { name: "Homing bullets", cost: 5000, desc: "Your little suns curve toward the nearest enemy." }
};
const UP_ORDER = ["shield", "bullets", "life", "suns", "homing"];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const inR = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const hh = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };   // stable pseudo-random 0..1
const cycleInfo = n => ({ w: ((n - 1) % TOTAL_WAVES) + 1, c: Math.floor((n - 1) / TOTAL_WAVES) });  // w = wave inside the cycle, c = loop number (0 = first)
function use(c) { ctx = c; c.setTransform(DPR, 0, 0, DPR, 0, 0); }
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = wrap.clientWidth || 800; H = wrap.clientHeight || 640;
  cv.width = buf.width = W * DPR; cv.height = buf.height = H * DPR;
  player.x = clamp(player.x, player.r, W - player.r); player.y = clamp(player.y, player.r, H - player.r);
}
function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function hglow(x, y, r, h, s, l, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `hsla(${h},${s}%,${l}%,${a})`); g.addColorStop(1, `hsla(${h},${s}%,${l}%,0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(t, x, y, mw, lh) {
  let line = "";
  for (const w of t.split(" ")) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > mw && line) { ctx.fillText(line, x, y); line = w; y += lh; } else line = test;
  }
  ctx.fillText(line, x, y);
}

/* ===================== SPRITES ===================== */
function mkOrb(c0, c1, c2, glowRgb) {
  const size = 64, c = document.createElement("canvas");
  c.width = c.height = size * 2;
  const g = c.getContext("2d"); g.scale(2, 2); g.translate(size / 2, size / 2);
  const R = 14, h = g.createRadialGradient(0, 0, R * .6, 0, 0, size / 2);
  h.addColorStop(0, `rgba(${glowRgb},.55)`); h.addColorStop(1, `rgba(${glowRgb},0)`);
  g.fillStyle = h; g.beginPath(); g.arc(0, 0, size / 2, 0, TAU); g.fill();
  const b = g.createRadialGradient(0, 0, 0, 0, 0, R);
  b.addColorStop(0, c0); b.addColorStop(.5, c1); b.addColorStop(1, c2);
  g.fillStyle = b; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
  return { sprite: c, size, core: R };
}
const MINI = [
  ["#ffffff", "#fff0a0", "#ffb53a", "255,200,90"], ["#fffdf0", "#ffe070", "#ff9a2e", "255,170,60"],
  ["#fff8e0", "#ffd060", "#ff7a1f", "255,140,50"], ["#ffffff", "#ffe9b0", "#ffc94a", "255,215,110"]
].map(t => mkOrb(...t));
const ESPR = [
  mkOrb("#fff0f0", "#ff5a5a", "#a00018", "255,40,50"),     // 0 red
  mkOrb("#f0f8ff", "#5aa8ff", "#0a3a9a", "60,140,255"),    // 1 blue (spiral)
  mkOrb("#ffffff", "#9fe4ff", "#2a7fd0", "120,210,255"),   // 2 cyan (giant sun)
  mkOrb("#ffffff", "#f2f5ff", "#a9b6e8", "230,236,255")    // 3 white (twin star)
];

const gran = document.createElement("canvas"); gran.width = gran.height = 512;
(function () {
  const g = gran.getContext("2d"), R = rng(77);
  for (let i = 0; i < 900; i++) {
    const x = R() * 512, y = R() * 512, s = 6 + R() * 16, hot = R() > .5;
    const gr = g.createRadialGradient(x, y, 0, x, y, s);
    gr.addColorStop(0, hot ? "rgba(255,245,190,.35)" : "rgba(220,110,20,.28)");
    gr.addColorStop(1, hot ? "rgba(255,245,190,0)" : "rgba(220,110,20,0)");
    g.fillStyle = gr; g.fillRect(x - s, y - s, s * 2, s * 2);
  }
})();

/* ===================== BACKGROUND ===================== */
function makeGalaxy(seed, c1, c2, arms, spread, size) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"), R = rng(seed), h = size / 2;
  g.translate(h, h); g.globalCompositeOperation = "lighter";
  const core = g.createRadialGradient(0, 0, 0, 0, 0, h * .45);
  core.addColorStop(0, `rgba(${c1},.6)`); core.addColorStop(1, `rgba(${c1},0)`);
  g.fillStyle = core; g.beginPath(); g.arc(0, 0, h * .45, 0, TAU); g.fill();
  const pos = () => {
    if (!arms) { const r = Math.pow(R(), 1.6) * h * .82, th = R() * TAU; return [Math.cos(th) * r, Math.sin(th) * r, r / (h * .82)]; }
    const t = Math.pow(R(), .7), r = t * h * .92 + 2, th = t * 4.2 + Math.floor(R() * arms) * TAU / arms + (R() - .5) * spread;
    return [Math.cos(th) * r, Math.sin(th) * r, t];
  };
  for (let i = 0; i < 2600; i++) {
    const [x, y, t] = pos(), col = t < .35 ? c1 : c2, s = .8 + R() * 1.6;
    g.fillStyle = `rgba(${col},${.08 + R() * .22})`; g.fillRect(x, y, s, s);
  }
  for (let i = 0; i < 40; i++) {
    const [x, y, t] = pos(), rr = 6 + R() * 8, gr = g.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, `rgba(${t < .35 ? c1 : c2},.1)`); gr.addColorStop(1, `rgba(${c2},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rr, 0, TAU); g.fill();
  }
  return c;
}
const GAL = [
  { spr: makeGalaxy(3, "200,215,255", "120,150,255", 2, .5, 256), x: .18, y: .22, s: 230, rot: .4, rs: .004, tilt: .55, a: .24 },
  { spr: makeGalaxy(8, "255,225,190", "255,150,170", 3, .7, 256), x: .82, y: .62, s: 280, rot: 2.1, rs: -.003, tilt: .7, a: .22 },
  { spr: makeGalaxy(12, "255,235,210", "200,160,255", 0, 0, 256), x: .6, y: .12, s: 170, rot: .9, rs: .002, tilt: .5, a: .2 },
  { spr: makeGalaxy(21, "190,230,255", "150,120,255", 2, .4, 256), x: .35, y: .78, s: 200, rot: 5, rs: .0035, tilt: .4, a: .18 }
];
function makeNebula(seed, pal) {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 768;
  const g = c.getContext("2d"), R = rng(seed);
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 15; i++) {
    const x = R() * 1024, y = R() * 768, r = 150 + R() * 280, col = pal[(R() * pal.length) | 0], a = .09 + R() * .13;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 600; i++) {
    g.fillStyle = `rgba(${pal[(R() * pal.length) | 0]},${.08 + R() * .16})`;
    g.fillRect(R() * 1024, R() * 768, 1 + R() * 2, 1 + R() * 2);
  }
  return c;
}
const NEB1 = makeNebula(5, ["70,60,210", "125,60,205", "60,115,225", "165,70,195", "40,90,175"]);
const NEB2 = makeNebula(9, ["40,165,175", "115,70,215", "205,90,175", "50,115,205"]);

/* pixel-art moon for the wormhole shop (32x32, scaled up with no smoothing) */
const MOON = (function () {
  const N = 32, c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d"), R = rng(404), pal = ["#3c3f55", "#6a6e88", "#a4a9c4", "#e2e6f5"];
  const cr = [[11, 12, 4.2], [21, 9, 3], [19, 21, 5], [9, 22, 2.6], [24, 16, 2], [14, 5, 2]];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = x + .5 - 16, dy = y + .5 - 16, d = Math.hypot(dx, dy);
    if (d > 15.2) continue;
    let l = .55 - (dx * .6 + dy * .8) / 15 * .45 - Math.pow(d / 15, 3) * .25 + (R() - .5) * .1;
    for (const [cx, cy, r] of cr) { const dd = Math.hypot(x + .5 - cx, y + .5 - cy); if (dd < r) l -= .3; else if (dd < r + 1.3) l += .12; }
    g.fillStyle = pal[clamp(Math.floor(l * 4), 0, 3)]; g.fillRect(x, y, 1, 1);
  }
  return c;
})();

/* grey fog textures for the wave 10 boss background (tile horizontally) */
function makeFog(seed) {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 768;
  const g = c.getContext("2d"), R = rng(seed);
  for (let i = 0; i < 26; i++) {
    const x = R() * 1024, y = R() * 768, r = 110 + R() * 230, dark = R() < .55, a = .1 + R() * .16;
    const col = dark ? "96,102,114" : "255,255,255";
    for (const o of [-1024, 0, 1024]) {
      const gr = g.createRadialGradient(x + o, y, 0, x + o, y, r);
      gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(x + o - r, y - r, r * 2, r * 2);
    }
  }
  return c;
}
const FOG = [makeFog(31), makeFog(47), makeFog(63)];

/* ===================== PLAYER PLANETS ===================== */
const PLANETS = [
  { c: ["#d8d2cc", "#8f8a85", "#3d3a38"], r: 3.2 },                    // Mercury
  { c: ["#fff0c8", "#dfb868", "#7a5424"], r: 4.4 },                    // Venus
  { c: ["#bfe3ff", "#2a79da", "#071c4d"], r: 4.6, earth: true },       // Earth
  { c: ["#ffb590", "#c4512b", "#4a170a"], r: 3.8 },                    // Mars
  { c: ["#f6e0be", "#c98f56", "#5f3a1c"], r: 5.6, bands: true }        // Jupiter
];
const PR = 46;      // orbit radius (horizontal)
const PRY = .36;    // orbit squash: planets pass in front of and behind the sun
const freshPlanets = () => PLANETS.map((p, i) => ({ ...p, a0: i / PLANETS.length * TAU, alive: true }));

/* ===================== STATE ===================== */
const player = { x: 400, y: 500, r: 24, speed: 340, focusSpeed: 150, hitR: 2.5, cooldown: 0, hp: 5, maxHp: 5, regen: 0, inv: 0, orbit: 0, bombs: START_BOMBS, planets: freshPlanets(), minis: [], shield: 0, shT: 0, shFlash: 0 };
const owned = { shield: false, bullets: false, life: false, suns: false, homing: false };
const B = [], E = [], EB = [], FX = [], sparks = [], lasers = [], holes = [], trail = [], PX = [];
let boss = null, st = "title", paused = false, focus = false, time = 0, mt = 0, wave = 1, score = 0, scoreFrac = 0, kills = 0, flashA = 0, fogOn = false, endless = false, last = performance.now();
let menuBtn = null, menuBtn2 = null, newBest = false, best = { score: 0, wave: 0 };
try { const s = JSON.parse(localStorage.getItem("sunthrower-best") || "null"); if (s) best = s; } catch (e) {}
const ws = { phase: "banner", t: 0, left: 0, timer: 0, cfg: null, label: "" };
const warp = { t: 0, dur: 3, dir: "in" };
const shop = { t: 0, cards: [], leave: null, msg: "", msgT: 0, bonus: 0 };
const shake = { t: 0, dur: .4, mag: 0 };
const vic = { x: 400, y: 120 };                                       // where TON 618 exploded
const SCOL = ["210,220,255", "190,175,255", "160,200,255"];
const stars = Array.from({ length: 170 }, () => ({ x: rnd(), y: rnd(), z: .2 + rnd() * .8, tw: rnd() * TAU, c: SCOL[(rnd() * 3) | 0] }));
const keys = new Set(), pointer = { x: 0, y: 0, down: false };
const LW = 30;                                                        // laser damage width
const BC = { nb: 20, spd: 150, fuse: 1.7, hp: 6, chp: 4, L: 14 };    // TON 618 summon settings (scaled per loop)
const SUNC = { chp: 5, L: 12 };                                      // giant sun's shooting stars (scaled per loop)
const TRAIL_LIFE = .7;
const PAL = {
  sun: ["#ff5a4a", "#c0182a", "#7a0a14", "#ffb3a0"], spiral: ["#9fd0ff", "#5aa8ff", "#1d4fc4", "#ffffff"],
  comet: ["#ffffff", "#aad4ff", "#7aa8ff"], giant: ["#ffffff", "#d6f3ff", "#86c8ff", "#4a98e8"],
  twin: ["#ffffff", "#e8ecff", "#b8c4ff", "#8fa0e8"],
  player: ["#fffbe3", "#ffe58a", "#ffb83a", "#f07a14"], hole: ["#000000", "#ffd9a0", "#ff9a4a", "#9db8ff"]
};
const VRGB = ["255,60,60", "255,200,40", "60,255,120", "60,200,255", "170,80,255", "255,80,200", "255,255,255"];   // violent rainbow
const VPAL = ["#ff3b3b", "#ffd23b", "#3bff7a", "#3bd0ff", "#9b5bff", "#ff5bd0", "#ffffff"];
const KRGB = { comet: "170,210,255", spiral: "100,160,255", twin: "225,232,255", sun: "255,90,60" };

resize(); player.x = W / 2; player.y = H * .8;
addEventListener("resize", resize);

const prune = a => { let j = 0; for (const x of a) if (!x.dead) a[j++] = x; a.length = j; };
const vuln = () => boss && !boss.dying && boss.entry >= 3 && boss.inv <= 0;
const hs = h => clamp(Math.min(h.age / .5, (h.life - h.age) / .5), 0, 1);   // mini black hole scale
const voidAmt = () => boss && boss.kind === "ton" ? (boss.entry >= BANG_T ? 1 : clamp(boss.entry / BANG_T, 0, 1)) : 0;
const tonScale = b => { const q = 1 - b.dy / b.dd; return q < .6 ? 1 : Math.max(.04, 1 - (q - .6) / .4 * .96); };   // black hole collapse during the cutscene

/* points: x1.2 after wave 5 (fractions carry over so nothing is lost) */
function addScore(n) {
  const v = n * (wave > BONUS_AFTER ? BONUS_MULT : 1) + scoreFrac, i = Math.floor(v + 1e-9);
  scoreFrac = v - i; score += i;
}

function reset() {
  [B, E, EB, FX, sparks, lasers, holes, trail, PX].forEach(a => a.length = 0);
  boss = null; score = 0; scoreFrac = 0; kills = 0; fogOn = false; endless = false; shop.bonus = 0;
  player.maxHp = 5; player.hp = player.maxHp; player.regen = 0; player.inv = 0; player.bombs = START_BOMBS;
  player.planets = freshPlanets(); player.minis = []; player.shield = 0; player.shT = 0; player.shFlash = 0;
  owned.shield = owned.bullets = owned.life = owned.suns = owned.homing = false;
  player.x = W / 2; player.y = H * .8; st = "play"; mt = 0; paused = false; flashA = 0; startWave(1);
}
function endGame(kind) {
  st = kind; mt = 0; newBest = score > best.score;
  if (newBest) best.score = score;
  best.wave = Math.max(best.wave, wave);
  try { localStorage.setItem("sunthrower-best", JSON.stringify(best)); } catch (e) {}
}
/* after the victory cutscene: keep going into endless mode, or finish the run */
function continueRun() {
  endless = true; st = "play"; paused = false; mt = 0;
  [B, E, EB, lasers, holes, trail].forEach(a => a.length = 0);
  player.hp = player.maxHp; player.inv = 2; player.bombs = START_BOMBS; player.planets.forEach(p => p.alive = true);
  player.x = W / 2; player.y = H * .8; flashA = 1;
  startWave(wave + 1);
}
function finishRun() { endGame("win"); }

/* ===================== EFFECTS ===================== */
function pixels(x, y, pal, n, spd, size, life = .9) {
  if (PX.length > 1600) return;
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, s = spd * (.2 + rnd() * .8);
    PX.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, age: 0, life: life * (.6 + rnd() * .7),
      s: Math.round(size * (rnd() < .25 ? 1.7 : 1)), c: pal[(rnd() * pal.length) | 0] });
  }
}
function doShake(mag, dur) { shake.mag = mag; shake.t = shake.dur = dur; }
function fxUpdate(dt) {
  for (const f of FX) { f.age += dt; if (f.age >= f.life) f.dead = true; }
  for (const s of sparks) { s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .985; s.vy *= .985; if (s.age > s.life) s.dead = true; }
  for (const p of PX) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .97; p.vy *= .97; if (p.age >= p.life) p.dead = true; }
  [FX, sparks, PX].forEach(prune);
}

/* ===================== WAVES ===================== */
function startWave(n) {
  const { w, c } = cycleInfo(n), hm = 1 + c * .6;
  wave = n; fogOn = false; ws.phase = "banner"; ws.t = 2.6; ws.cfg = null; ws.label = "Wave " + n;
  BC.nb = Math.min(40, 20 + c * 4); BC.spd = 150 + c * 20; BC.hp = 6 + c * 2; BC.chp = 4 + c; BC.L = 14 + c * 3;   // each loop is harder
  SUNC.chp = 5 + c; SUNC.L = 12 + c * 3;
  if (w === TOTAL_WAVES) {
    ws.label = "Wave " + n + ": TON 618";
    const hp = Math.round(2000 * hm);
    boss = { kind: "ton", name: "TON 618", x: W / 2, y: H * .2, R: 50, hp, max: hp, ph: 1, t: 0, entry: 0, inv: 0, sp: 0, sp2: 1, lz: 0, hole: 0, bt: 0, btxt: "", dying: false, dy: 0, dd: 6.5, marks: [.33, .66] };
  } else if (w === MID_BOSS_WAVE) {
    ws.label = "Wave " + n + ": Cerulean Giant";
    const hp = Math.round(1400 * hm);
    boss = { kind: "sun", name: "Cerulean Giant", x: W / 2, y: H * .2, R: 64, hp, max: hp, ph: 1, t: 0, entry: 0, inv: 0, bt: 0, btxt: "", fire: 0, ring: 2.5, star: 3, dying: false, dy: 0, dd: 2.4, marks: [.5] };
  } else {
    const L = w * 1.3 + c * 7;
    ws.cfg = {
      L, count: 6 + w * 2 + c * 4, interval: Math.max(.45, 1.9 - L * .07), cometP: n < 2 ? 0 : Math.min(.55, .12 + L * .03),
      spiralP: n < 3 ? 0 : Math.min(.4, .1 + L * .02),
      twinP: n <= TWIN_AFTER ? 0 : Math.min(.3, .1 + (n - TWIN_AFTER) * .05),

      player.regen = 0; player.hp++; revivePlanet();
      FX.push({ x: player.x, y: player.y, age: 0, life: .8, r: 130, rgb: "255,200,80" });
      pixels(player.x, player.y, ["#ffffff", "#ffe58a", "#ffb83a"], 30, 180, 3, .9);
    }
  } else player.regen = 0;

  /* shield timer */
  if (owned.shield) {
    player.shT += dt;
    if (player.shT >= SHIELD_EVERY) {
      player.shT = 0; player.shield = SHIELD_CHARGES;
      FX.push({ x: player.x, y: player.y, age: 0, life: .6, r: 120, rgb: "130,220,255" });
    }
  }
  player.shFlash = Math.max(0, player.shFlash - dt);

  /* wave flow */
  if (ws.phase === "banner") { ws.t -= dt; if (ws.t <= 0) ws.phase = "fight"; }
  else if (ws.phase === "fight") {
    if (boss) updateBoss(dt);
    else if (ws.cfg) {
      const c = ws.cfg;
      if (ws.left > 0) {
        ws.timer -= dt;
        if (ws.timer <= 0) {
          const twins = E.filter(e => e.t === "twin").length;
          if (c.twinP && twins < 4 && rnd() < c.twinP) spawnTwin(c);
          else {
            const q = rnd();
            q < c.cometP ? spawnComet(c) : q < c.cometP + c.spiralP ? spawnSpiral(c, false) : spawnSun(c, false);
          }
          ws.left--; ws.timer = c.interval * (.7 + rnd() * .6);
        }
      } else if (E.length === 0) { ws.phase = "clear"; ws.t = 1.2; }
    }
  } else { ws.t -= dt; if (ws.t <= 0) afterWave(); }
  if (st !== "play") return;                                 // the victory cutscene may have started

  /* player bullets */
  for (const b of B) {
    if (owned.homing) {
      const t = nearestTarget(b.x, b.y);
      if (t) {
        const sp = Math.hypot(b.vx, b.vy), cur = Math.atan2(b.vy, b.vx), d = angDiff(cur, Math.atan2(t.y - b.y, t.x - b.x));
        if (Math.abs(d) < 1.4) { const na = cur + clamp(d, -6 * dt, 6 * dt); b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp; }
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const h of holes) {
      const s = hs(h); if (s <= 0) continue;
      const hx = h.x - b.x, hy = h.y - b.y, d = Math.hypot(hx, hy);
      if (d < h.r * s + 4) { b.dead = true; FX.push({ x: b.x, y: b.y, age: 0, life: .3, r: 18, rgb: "150,170,255" }); }
      else if (d < 160 * s) { const a = 3e5 / (d + 40); b.vx += hx / d * a * dt; b.vy += hy / d * a * dt; }
    }
    if (!b.dead) for (const e of E) {
      if (e.dead || Math.hypot(e.x - b.x, e.y - b.y) >= e.r + b.hitR) continue;
      b.dead = true; e.hp--;
      FX.push({ x: b.x, y: b.y, age: 0, life: .25, r: 13, rgb: "255,220,150" });
      if (e.hp <= 0) kill(e);
      break;
    }
    if (!b.dead && boss && !boss.dying && boss.entry >= BANG_T && Math.hypot(boss.x - b.x, boss.y - b.y) < boss.R * 1.1) {
      b.dead = true; if (vuln()) { boss.hp--; addScore(2); }
      FX.push({ x: b.x, y: b.y, age: 0, life: .25, r: 14, rgb: "180,210,255" });
    }
    if (b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60) b.dead = true;
  }

  /* enemies */
  for (const e of E) {
    e.age += dt;
    if (e.t === "sun" || e.t === "spiral") {
      e.fuse -= dt;
      if (e.fuse <= 0) { e.t === "spiral" ? explodeSpiral(e) : explode(e); e.dead = true; }
    } else if (e.t === "twin") {
      e.x = e.x0 + Math.sin(e.age * .7 + e.ph) * 34;
      e.fire -= dt;
      if (e.fire <= 0 && e.age > .6) { twinShot(e); e.fire = 2; }
    } else {
      const d = angDiff(e.ang, Math.atan2(player.y - e.y, player.x - e.x));
      e.ang += clamp(d, -e.turn * dt, e.turn * dt);
      e.x += Math.cos(e.ang) * e.sp * dt; e.y += Math.sin(e.ang) * e.sp * dt;
      e.hist.push(e.x, e.y); if (e.hist.length > 72) e.hist.splice(0, 2);
      if ((e.age > 1.5 && (e.x < -150 || e.x > W + 150 || e.y < -150 || e.y > H + 150)) || e.age > 10) e.dead = true;
      if (player.inv <= 0 && Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.hitR) {
        e.dead = true; pixels(e.x, e.y, PAL.comet, 18, 150, 3); hurt();
        FX.push({ x: e.x, y: e.y, age: 0, life: .5, r: 50, rgb: "170,210,255" });
      }
    }
  }

  /* enemy bullets (the shield catches them first) */
  for (const b of EB) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) { b.dead = true; continue; }
    const d = Math.hypot(b.x - player.x, b.y - player.y);
    if (player.shield > 0 && d < SHR + b.r) {
      b.dead = true; player.shield--; player.shFlash = .25;
      pixels(b.x, b.y, ["#ffffff", "#bff3ff", "#7fd8ff"], 7, 110, 2, .5);
      FX.push({ x: b.x, y: b.y, age: 0, life: .3, r: 26, rgb: "150,230,255" });
      if (player.shield === 0) {
        pixels(player.x, player.y, ["#ffffff", "#bff3ff", "#7fd8ff"], 36, 220, 3, .8);
        FX.push({ x: player.x, y: player.y, age: 0, life: .5, r: 110, rgb: "130,220,255" });
      }
    } else if (player.inv <= 0 && d < b.r + player.hitR) { hurt(); break; }
  }

  /* lasers + mini black holes */
  for (const L of lasers) {
    L.t += dt;
    if (L.t >= 0 && L.t < L.w * .65 && L.track) L.p = L.a === "v" ? player.x : player.y;
    if (L.t >= L.w && L.t < L.w + L.f && Math.abs((L.a === "v" ? player.x : player.y) - L.p) < LW / 2 + player.hitR) hurt();
    if (L.t >= L.w + L.f) L.dead = true;
  }
  for (const h of holes) { h.age += dt; if (h.age >= h.life) h.dead = true; }

  if (rnd() < dt * 28) spark(rnd() * TAU);
  fxUpdate(dt);
  [B, E, EB, lasers, holes].forEach(prune);
}

function drawWarp() {
  const p = clamp(warp.t / warp.dur, 0, 1), t = warp.t, z = t * 1.6 + t * t * 1.1;

  }

      ctx.strokeStyle = `hsla(${(hb + hueOff + k * 22) % 360},95%,62%,${al})`; ctx.lineWidth = lw; ctx.beginPath();

  }

  glow(cx, cy, 30 + 100 * p + 10 * pulse, "255,255,255", .95);

function draw(dt) {
  menuBtn = null; menuBtn2 = null;
  if (st === "title") { drawTitle(dt); flashOverlay(); return; }
  if (st === "warpin" || st === "warpout") { use(mx); drawWarp(); flashOverlay(); return; }
  if (st === "shop") { use(mx); drawShop(dt); flashOverlay(); return; }
  if (st === "victory") { drawVictory(dt); flashOverlay(); return; }

  use(bx); drawBackground(dt, false);
  drawTrail();
  const bShow = boss && boss.entry >= BANG_T;                // boss only exists visually after the bang
  const pop = boss && boss.entry < 3 ? 1 + .55 * Math.pow(1 - clamp((boss.entry - BANG_T) / .8, 0, 1), 2) : 1;
  const bR = boss ? boss.R * pop * (boss.kind === "ton" && boss.dying ? tonScale(boss) : 1) : 0;
  if (bShow && boss.kind === "sun") drawGiantSun(boss, bR);
  for (const e of E) e.t === "comet" ? drawComet(e) : e.t === "spiral" ? drawBlueSun(e) : e.t === "twin" ? drawTwinStar(e) : drawRedSun(e);
  ctx.globalCompositeOperation = "lighter";
  for (const s of sparks) glow(s.x, s.y, s.s * 2.5, "255,150,40", .7 * (1 - s.age / s.life));
  for (const f of FX) {
    const k = f.age / f.life;
    if (f.ring) { ctx.strokeStyle = `rgba(${f.rgb},${(1 - k) * .9})`; ctx.lineWidth = 4 + 18 * (1 - k); ctx.beginPath(); ctx.arc(f.x, f.y, f.r * k, 0, TAU); ctx.stroke(); }
    else glow(f.x, f.y, f.r * (.3 + .7 * k), f.rgb, .7 * (1 - k));
  }
  ctx.globalCompositeOperation = fogOn ? "source-over" : "lighter";     // additive bullets would vanish on the bright fog
  for (const b of EB) {
    const S = ESPR[b.k], d = S.size * b.r / S.core; ctx.drawImage(S.sprite, b.x - d / 2, b.y - d / 2, d, d);
    if (fogOn) { ctx.strokeStyle = "rgba(10,40,110,.85)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.05, 0, TAU); ctx.stroke(); }
  }
  for (const b of B) {
    const d = b.tint.size * b.scale * (1 + .12 * Math.sin(time * 12 + b.phase)); ctx.drawImage(b.tint.sprite, b.x - d / 2, b.y - d / 2, d, d);
    if (fogOn) { ctx.strokeStyle = "rgba(150,60,0,.8)"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(b.x, b.y, b.tint.core * b.scale, 0, TAU); ctx.stroke(); }
  }
  ctx.globalCompositeOperation = "source-over";
  drawPixels();

  mx.setTransform(1, 0, 0, 1, 0, 0); mx.drawImage(buf, 0, 0);
  if (bShow && boss.kind === "ton") lens(boss.x, boss.y, bR, 4.4, 28, 1.2);
  for (const h of holes) { const s = hs(h); if (s > .05) lens(h.x, h.y, h.r * s, 4.2, 10, 1); }

  use(mx);
  drawLasers();
  for (const h of holes) {
    const s = hs(h); if (s <= .02) continue;
    ctx.strokeStyle = `rgba(150,170,255,${.15 * s})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(h.x, h.y, 160 * s, 0, TAU); ctx.stroke();
    drawHole(h.x, h.y, h.r * s, time, s);
  }
  if (bShow && boss.kind === "ton") { if (boss.dying) drawTear(boss, bR); else drawHole(boss.x, boss.y, bR, time, 1); }
  drawBossIntro();
  drawMinis(); if (st !== "over") drawSun(); drawShield(); hud();

  if (st === "over" || st === "win") drawEnd(st);
  else if (paused) overlayText("Paused", "Click or press P to continue");
  flashOverlay();
}

/* ===================== LOOP ===================== */
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  const running = !(st === "play" && paused);
  if (running) time += dt;
  mt += dt;
  flashA = Math.max(0, flashA - dt * 2);
  shake.t = Math.max(0, shake.t - dt);
  cv.style.transform = shake.t > 0
    ? `translate(${(rnd() - .5) * 2 * shake.mag * shake.t / shake.dur}px,${(rnd() - .5) * 2 * shake.mag * shake.t / shake.dur}px)` : "";

  if (st === "play") { if (!paused) update(dt); }
  else if (st === "warpin" || st === "warpout") { warp.t += dt; idleUpdate(dt); if (warp.t >= warp.dur) finishWarp(); }
  else if (st === "shop") { shop.t += dt; shop.msgT -= dt; idleUpdate(dt); }
  else if (st === "victory") {
    player.orbit += dt * 2.4; player.inv = Math.max(0, player.inv - dt); fxUpdate(dt);
    if (mt < 2.2 && rnd() < dt * 60) pixels(vic.x, vic.y, VPAL, 10, 460, 4, 1.2);
  }
  else if (st === "over" || st === "win") fxUpdate(dt);

  draw(running ? dt : 0);
  const hov = (menuBtn && inR(menuBtn, pointer.x, pointer.y)) || (menuBtn2 && inR(menuBtn2, pointer.x, pointer.y)) ||
    (st === "shop" && (shop.cards.some(c => inR(c, pointer.x, pointer.y)) || (shop.leave && inR(shop.leave, pointer.x, pointer.y))));
  cv.style.cursor = hov ? "pointer" : "default";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
